name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR: iPhone 17 Pro

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Schdule.xcodeproj \
            -scheme Schdule \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -only-testing:SchduleKitTests \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: UnitTests.xcresult

  # One job running every configuration in sequence, not a matrix.
  #
  # Hosted macOS runners are handed out two or three at a time, so a five-leg
  # matrix does not run in parallel — it queues, and each leg pays the setup
  # cost again. Sequential in one slot finishes sooner in wall-clock terms and
  # produces a single artifact to download.
  screenshots:
    name: Screenshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Only XcodeGen, which is a prebuilt bottle. Screenshot extraction used to
      # pull in a third-party tap that took roughly ten minutes to install on
      # every matrix leg — longer than the tour it was supporting.
      - name: Install tooling
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A cold simulator makes the first app launch slow enough that XCUITest
      # gives up with "Timed out while launching application via Xcode". Booting
      # it up front and waiting for it to settle turns that flake into a
      # predictable few seconds.
      - name: Pre-boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$SIMULATOR'))")
          echo "Booting $SIMULATOR ($UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run screenshot tour
        run: |
          set -o pipefail
          run_tour() {
            xcodebuild test \
              -project Schdule.xcodeproj \
              -scheme Schdule \
              -destination "platform=iOS Simulator,name=$SIMULATOR" \
              -only-testing:SchduleUITests/ScreenshotTour \
              -resultBundlePath "$1" \
              CODE_SIGNING_ALLOWED=NO
          }
          # One retry. Launch timeouts on a hosted runner are environmental
          # rather than a signal about the code, and a red run costs a whole
          # review round.
          run_tour Tour.xcresult || {
            echo "::warning::First tour attempt failed; retrying once."
            rm -rf Tour.xcresult
            run_tour Tour.xcresult
          }

      - name: Extract screenshots from result bundle
        if: always()
        run: |
          mkdir -p Raw Screenshots
          # xcresulttool ships with Xcode, so this needs no install at all. It
          # writes opaque filenames plus a manifest naming each one.
          xcrun xcresulttool export attachments \
            --path Tour.xcresult \
            --output-path Raw || true
          python3 - <<'PY'
          import json, pathlib, shutil

          raw = pathlib.Path("Raw")
          out = pathlib.Path("Screenshots")
          manifest = raw / "manifest.json"

          def entries(blob):
              """The manifest has changed shape between Xcode versions, so walk
              whatever nesting it arrives in rather than assuming one."""
              if isinstance(blob, dict):
                  for key in ("attachments", "tests"):
                      if key in blob:
                          yield from entries(blob[key])
                          return
                  if "exportedFileName" in blob:
                      yield blob
              elif isinstance(blob, list):
                  for item in blob:
                      yield from entries(item)

          copied = 0
          if manifest.exists():
              for item in entries(json.loads(manifest.read_text())):
                  src = raw / item["exportedFileName"]
                  if not src.exists():
                      continue
                  name = item.get("suggestedHumanReadableName") or src.stem
                  if not name.lower().endswith(".png"):
                      name += ".png"
                  shutil.copyfile(src, out / name)
                  copied += 1

          # Fall back to whatever PNGs are there if the manifest was unusable.
          if copied == 0:
              for src in raw.rglob("*.png"):
                  shutil.copyfile(src, out / src.name)
                  copied += 1
          print(f"copied {copied} screenshots")
          PY
          echo "--- extracted ---"
          find Screenshots -type f -name '*.png' | sort
          # A green job that produced no frames is worse than a red one: it
          # looks reviewed when nothing was reviewed.
          test "$(find Screenshots -name '*.png' | wc -l)" -ge 24

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots
          if-no-files-found: warn

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tour-results
          path: Tour.xcresult

  # An unsigned .ipa for sideloading (AltStore, Sideloadly, TrollStore).
  #
  # Unsigned rather than ad-hoc signed because this repository holds no
  # certificate and no provisioning profile, and it should not: whoever installs
  # it signs it with their own Apple ID at install time. That also means it
  # cannot be installed by double-clicking — a sideloading tool has to re-sign
  # it first.
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive for device
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Schdule.xcodeproj \
            -scheme Schdule \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Schdule.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package as .ipa
        run: |
          set -euo pipefail
          APP="build/Schdule.xcarchive/Products/Applications/Schdule.app"
          test -d "$APP" || { echo "No .app in the archive"; exit 1; }

          # An .ipa is a zip with the bundle inside a folder named Payload, and
          # nothing else is required for a sideloader to re-sign it.
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Schdule-unsigned.ipa Payload)

          echo "--- contents ---"
          unzip -l build/Schdule-unsigned.ipa | head -20
          ls -lh build/Schdule-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Schdule-unsigned-ipa
          path: build/Schdule-unsigned.ipa
          if-no-files-found: error
