name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR: iPhone 17 Pro

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Schdule.xcodeproj \
            -scheme Schdule \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -only-testing:SchduleKitTests \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: UnitTests.xcresult

  screenshots:
    name: Screenshots (${{ matrix.config }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each configuration is its own test method rather than an environment
        # variable, so a matrix leg cannot silently render the wrong one.
        include:
          - config: ar-dark
            method: testTourArabicDark
          - config: ar-light
            method: testTourArabicLight
          - config: en-dark
            method: testTourEnglishDark
          - config: en-light
            method: testTourEnglishLight
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: brew install xcodegen chargepoint/xcparse/xcparse

      - name: Generate project
        run: xcodegen generate

      # A cold simulator makes the first app launch slow enough that XCUITest
      # gives up with "Timed out while launching application via Xcode". Booting
      # it up front and waiting for it to settle turns that flake into a
      # predictable few seconds.
      - name: Pre-boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name']=='$SIMULATOR'))")
          echo "Booting $SIMULATOR ($UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run screenshot tour
        run: |
          set -o pipefail
          run_tour() {
            xcodebuild test \
              -project Schdule.xcodeproj \
              -scheme Schdule \
              -destination "platform=iOS Simulator,name=$SIMULATOR" \
              -only-testing:SchduleUITests/ScreenshotTour/${{ matrix.method }} \
              -resultBundlePath "$1" \
              CODE_SIGNING_ALLOWED=NO
          }
          # One retry. Launch timeouts on a hosted runner are environmental, not
          # a signal about the code, and a red matrix leg costs a whole review
          # round.
          run_tour Tour.xcresult || {
            echo "::warning::First tour attempt failed; retrying once."
            rm -rf Tour.xcresult
            run_tour Tour.xcresult
          }

      - name: Extract screenshots from result bundle
        if: always()
        run: |
          mkdir -p Screenshots
          xcparse screenshots --test Tour.xcresult Screenshots || true
          echo "--- extracted ---"
          find Screenshots -type f -name '*.png' | sort
          # A green job that produced no frames is worse than a red one: it
          # looks reviewed when nothing was reviewed.
          test "$(find Screenshots -name '*.png' | wc -l)" -ge 4

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.config }}
          path: Screenshots
          if-no-files-found: warn

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tour-results-${{ matrix.config }}
          path: Tour.xcresult
