name: Schdule

options:
  bundleIdPrefix: com.justpainful
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Simulator-only CI builds: no signing identity exists on the runner.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

packages:
  SchduleKit:
    path: Packages/SchduleKit

targets:
  Schdule:
    type: application
    platform: iOS
    sources:
      - path: App/Schdule
    dependencies:
      # embed is explicit: the product is a dynamic framework, and without a
      # copy phase it links fine and then fails at launch with "Library not
      # loaded". The IPA job asserts it made it into the bundle.
      - package: SchduleKit
        product: SchduleKit
        embed: true
      - target: SchduleWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.schdule
        PRODUCT_NAME: Schdule
        CODE_SIGN_ENTITLEMENTS: App/Schdule/Schdule.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Schdule/Info.plist
      properties:
        CFBundleDisplayName: Schdule
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        # An empty UILaunchScreen is what opts a SwiftUI app into full-screen
        # layout on modern devices instead of a letterboxed compatibility mode.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SchduleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/SchduleWidgets
        excludes:
          - "*.entitlements"
    dependencies:
      - package: SchduleKit
        product: SchduleKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.schdule.widgets
        PRODUCT_NAME: SchduleWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/SchduleWidgets/SchduleWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widgets/SchduleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Schdule
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SchduleKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SchduleKitTests
    dependencies:
      - package: SchduleKit
        product: SchduleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.schdule.kittests
        GENERATE_INFOPLIST_FILE: YES

  SchduleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/SchduleUITests
    dependencies:
      - target: Schdule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.schdule.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Schdule

schemes:
  Schdule:
    build:
      targets:
        Schdule: all
        SchduleKitTests: [test]
        SchduleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SchduleKitTests
        - SchduleUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
